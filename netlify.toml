# ─── Netlify Build Configuration ─────────────────────────────────────────────
#
# How to deploy on Netlify:
#   1. Connect your GitHub repo (Santhu7718/Local-EventBulletinBoard)
#   2. Netlify will auto-detect this file
#   3. Set the following Environment Variables in Netlify UI:
#        VITE_FIREBASE_API_KEY
#        VITE_FIREBASE_AUTH_DOMAIN
#        VITE_FIREBASE_PROJECT_ID
#        VITE_FIREBASE_APP_ID
#        VITE_API_URL  ← URL of your deployed backend (Railway/Render/Fly.io)
#
# ─────────────────────────────────────────────────────────────────────────────

[build]
  base    = "client"
  command = "npm install && npm run build"
  publish = "dist"

# ── SPA fallback — React Router needs all routes to serve index.html ──────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
